services:
  # ====== 数据库与向量库 ======
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnipilot-postgres
    environment:
      POSTGRES_USER: omnipilot
      POSTGRES_PASSWORD: omnipilot123
      POSTGRES_DB: omnipilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnipilot -d omnipilot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Milvus 依赖
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: omnipilot-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: omnipilot-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: omnipilot-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  # ====== 后端 API 服务 ======
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: omnipilot-backend
    env_file:
      - ../.env
    environment:
      # 容器内必须使用服务名，而不是 .env 里的 localhost
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started
    restart: unless-stopped

  # ====== 前端 + Nginx ======
  frontend:
    build:
      context: ../frontend-react
      dockerfile: Dockerfile
    container_name: omnipilot-frontend
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # ====== 监控套件 ======
  prometheus:
    image: prom/prometheus
    container_name: omnipilot-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: omnipilot-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
  prometheus_data:
  grafana_data: